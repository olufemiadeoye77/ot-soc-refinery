# OT SOC refinery sketch.
# This is the architecture, not the full deployment.
# Next session: Dockerfiles for refinery-simulator and ai-anomaly-agent,
# plus the Suricata rules and Wazuh rule files.

services:
  # --- OT ZONE ---
  openplc:
    image: openplc/openplc:latest
    ports:
      - "8080:8080"
    networks:
      - ot_zone

  refinery-simulator:
    build: ./refinery-simulator
    ports:
      - "5020:5020"
    networks:
      - ot_zone
    environment:
      - TICK_INTERVAL=1.0
      - MODBUS_PORT=5020

  # --- OT DMZ (surveillance on the OT bridge) ---
  suricata:
    image: jasonish/suricata:latest
    networks:
      - ot_zone
    volumes:
      - ./suricata/rules:/etc/suricata/rules:ro
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./telemetry/suricata:/var/log/suricata
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["-i", "eth0", "-c", "/etc/suricata/suricata.yaml"]

  zeek:
    image: zeek/zeek:latest
    networks:
      - ot_zone
    volumes:
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - ./telemetry/zeek:/usr/local/zeek/logs/current
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["zeek", "-i", "eth0", "-e", "redef Log::default_logdir=\"/usr/local/zeek/logs\";", "local"]

  ai-anomaly-agent:
    build: ./ai-anomaly-agent
    networks:
      - ot_zone
      - ot_dmz
    volumes:
      - /var/ot/telemetry:/var/ot/telemetry:ro
    environment:
      - LOG_PATH=/var/ot/telemetry/zeek/conn.log
      - MODBUS_HOST=refinery-simulator
      - MODBUS_PORT=5020

  # --- IT ZONE ---
  wazuh-manager:
    image: wazuh/wazuh-manager:latest
    ports:
      - "55000:55000"
      - "15601:5601"
    networks:
      - it_zone
    volumes:
      - ./wazuh/rules:/var/ossec/etc/rules:ro

  # --- AI triage (sketch, not implemented) ---
  ollama:
    image: ollama/ollama:latest
    networks:
      - it_zone

  ai-triage-agent:
    build: ./ai-triage-agent
    networks:
      - it_zone
    depends_on:
      - wazuh-manager
      - ollama
    environment:
      - WAZUH_URL=https://wazuh-manager:55000
      - OLLAMA_URL=http://ollama:11434

networks:
  ot_zone:
    driver: bridge
  ot_dmz:
    driver: bridge
  it_zone:
    driver: bridge
